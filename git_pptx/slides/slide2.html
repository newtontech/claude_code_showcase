<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 30pt 40pt; flex: 1;
}
h2 {
  color: #1A202C; font-size: 22pt; margin: 0 0 20pt 0;
}
.intro {
  color: #4A5568; font-size: 16pt; margin: 0 0 25pt 0; line-height: 1.6;
}
.features {
  display: flex; gap: 20pt;
}
.feature-box {
  flex: 1; background: #F7FAFC; padding: 20pt; border-radius: 8pt;
  border-left: 4pt solid #8C061C;
}
.feature-box h3 {
  color: #8C061C; font-size: 16pt; margin: 0 0 10pt 0;
}
.feature-box p {
  color: #4A5568; font-size: 14pt; margin: 0;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>什么是 Git？</h1>
</div>
<div class="content">
  <p class="intro">Git 是一个分布式版本控制系统，用于跟踪文件的更改并协调多人协作开发。</p>
  <div class="features">
    <div class="feature-box">
      <h3>分布式</h3>
      <p>每个开发者都有完整的代码仓库副本</p>
    </div>
    <div class="feature-box">
      <h3>高效</h3>
      <p>快速处理从小型到大型项目的版本管理</p>
    </div>
    <div class="feature-box">
      <h3>分支</h3>
      <p>轻松创建和合并分支进行并行开发</p>
    </div>
  </div>
</div>
<div class="pagenum"><p>2 / 8</p></div>
</body>
</html>
