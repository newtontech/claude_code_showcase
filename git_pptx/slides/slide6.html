<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 20pt 40pt; flex: 1;
}
h2 {
  color: #1A202C; font-size: 20pt; margin: 0 0 15pt 0;
}
.commands {
  display: flex; flex-direction: column; gap: 10pt;
}
.cmd-row {
  display: flex; align-items: center; gap: 15pt;
}
.cmd {
  background: #2D3748; color: #F56565; padding: 6pt 12pt;
  border-radius: 6pt; font-family: Courier New, monospace;
  font-size: 12pt; min-width: 220pt;
}
.cmd p { margin: 0; }
.desc {
  color: #4A5568; font-size: 13pt;
}
.desc p { margin: 0; }
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Git 分支管理</h1>
</div>
<div class="content">
  <h2>分支是 Git 的核心功能</h2>
  <div class="commands">
    <div class="cmd-row">
      <div class="cmd"><p>git branch</p></div>
      <div class="desc"><p>列出所有本地分支</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git branch [分支名]</p></div>
      <div class="desc"><p>创建新分支</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git checkout [分支名]</p></div>
      <div class="desc"><p>切换到指定分支</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git merge [分支名]</p></div>
      <div class="desc"><p>将指定分支合并到当前分支</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git branch -d [分支名]</p></div>
      <div class="desc"><p>删除已合并的分支</p></div>
    </div>
  </div>
</div>
<div class="pagenum"><p>6 / 8</p></div>
</body>
</html>
