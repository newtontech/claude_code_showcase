<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: relative;
}
.logo {
  width: 80pt; height: 80pt; margin-bottom: 30pt;
  background: #8C061C; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
}
.logo p {
  color: #ffffff; font-size: 40pt; font-weight: bold; margin: 0;
}
h1 {
  color: #1A202C; font-size: 48pt; margin: 0 0 15pt 0; text-align: center;
}
.subtitle {
  color: #4A5568; font-size: 20pt; margin: 0; text-align: center;
}
.footer {
  position: absolute; bottom: 30pt; width: 100%;
  display: flex; justify-content: center;
}
.footer p {
  color: #718096; font-size: 12pt; margin: 0;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="logo">
  <p>G</p>
</div>
<h1>Git 基础用法</h1>
<p class="subtitle">版本控制入门指南</p>
<div class="footer">
  <p>快速掌握 Git 核心命令与工作流程</p>
</div>
<div class="pagenum"><p>1 / 8</p></div>
</body>
</html>
