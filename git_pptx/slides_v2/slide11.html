<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 20pt 40pt; flex: 1; display: flex; gap: 25pt;
}
.left {
  flex: 1;
}
.left h2 {
  color: #1A202C; font-size: 18pt; margin: 0 0 15pt 0;
}
.commands {
  display: flex; flex-direction: column; gap: 8pt;
}
.cmd-row {
  display: flex; align-items: center; gap: 12pt;
}
.cmd {
  background: #2D3748; color: #F56565; padding: 5pt 10pt;
  border-radius: 5pt; font-family: Courier New, monospace;
  font-size: 11pt; min-width: 220pt;
}
.cmd p { margin: 0; }
.desc {
  color: #4A5568; font-size: 11pt;
}
.desc p { margin: 0; }
.right {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.right img {
  max-width: 100%; max-height: 250pt; border-radius: 8pt;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>远程仓库操作</h1>
</div>
<div class="content">
  <div class="left">
    <h2>远程协作命令</h2>
    <div class="commands">
      <div class="cmd-row">
        <div class="cmd"><p>git remote -v</p></div>
        <div class="desc"><p>查看远程仓库信息</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git fetch [远程]</p></div>
        <div class="desc"><p>获取远程仓库最新数据</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git pull [远程] [分支]</p></div>
        <div class="desc"><p>拉取并合并远程分支</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git push [远程] [分支]</p></div>
        <div class="desc"><p>推送本地分支到远程</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git remote add [名] [url]</p></div>
        <div class="desc"><p>添加新的远程仓库</p></div>
      </div>
    </div>
  </div>
  <div class="right">
    <img src="../images/git_remote.png">
  </div>
</div>
<div class="pagenum"><p>11 / 15</p></div>
</body>
</html>
