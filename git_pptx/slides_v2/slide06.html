<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 25pt 40pt; flex: 1;
}
h2 {
  color: #1A202C; font-size: 20pt; margin: 0 0 20pt 0;
}
.commands {
  display: flex; flex-direction: column; gap: 12pt;
}
.cmd-row {
  display: flex; align-items: center; gap: 15pt;
}
.cmd {
  background: #2D3748; color: #F56565; padding: 8pt 15pt;
  border-radius: 6pt; font-family: Courier New, monospace;
  font-size: 13pt; min-width: 280pt;
}
.cmd p {
  margin: 0;
}
.desc {
  color: #4A5568; font-size: 14pt;
}
.desc p {
  margin: 0;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Git 初始化与配置</h1>
</div>
<div class="content">
  <h2>开始使用 Git 的第一步</h2>
  <div class="commands">
    <div class="cmd-row">
      <div class="cmd"><p>git init</p></div>
      <div class="desc"><p>在当前目录创建新的 Git 仓库</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git clone [url]</p></div>
      <div class="desc"><p>克隆远程仓库到本地</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git config --global user.name "名字"</p></div>
      <div class="desc"><p>设置全局用户名</p></div>
    </div>
    <div class="cmd-row">
      <div class="cmd"><p>git config --global user.email "邮箱"</p></div>
      <div class="desc"><p>设置全局邮箱地址</p></div>
    </div>
  </div>
</div>
<div class="pagenum"><p>6 / 15</p></div>
</body>
</html>
