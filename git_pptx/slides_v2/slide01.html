<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: relative;
}
.logo-area {
  display: flex; align-items: center; gap: 20pt; margin-bottom: 30pt;
}
.logo {
  width: 70pt; height: 70pt;
}
.logo img {
  width: 100%; height: 100%; object-fit: contain;
}
h1 {
  color: #1A202C; font-size: 48pt; margin: 0 0 15pt 0; text-align: center;
}
.subtitle {
  color: #4A5568; font-size: 20pt; margin: 0 0 10pt 0; text-align: center;
}
.divider {
  width: 200pt; height: 3pt; background: #8C061C; margin: 20pt 0;
}
.parts {
  display: flex; gap: 60pt; margin-top: 20pt;
}
.part {
  text-align: center;
}
.part h3 {
  color: #8C061C; font-size: 16pt; margin: 0 0 5pt 0;
}
.part p {
  color: #718096; font-size: 12pt; margin: 0;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="logo-area">
  <div class="logo">
    <img src="../images/git_logo.png">
  </div>
</div>
<h1>Git 基础与高阶用法</h1>
<p class="subtitle">从入门到精通的版本控制指南</p>
<div class="divider"></div>
<div class="parts">
  <div class="part">
    <h3>第一章：基本用法</h3>
    <p>概念与日常操作</p>
  </div>
  <div class="part">
    <h3>第二章：高阶用法</h3>
    <p>分支管理与高级技巧</p>
  </div>
</div>
<div class="pagenum"><p>1 / 15</p></div>
</body>
</html>
