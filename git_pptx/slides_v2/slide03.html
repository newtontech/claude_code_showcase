<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #8C061C; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: relative;
}
.chapter-num {
  width: 80pt; height: 80pt; background: #ffffff;
  border-radius: 50%; display: flex; justify-content: center; align-items: center;
  margin-bottom: 20pt;
}
.chapter-num p {
  color: #8C061C; font-size: 40pt; font-weight: bold; margin: 0;
}
h1 {
  color: #ffffff; font-size: 42pt; margin: 0 0 15pt 0; text-align: center;
}
.subtitle {
  color: rgba(255,255,255,0.8); font-size: 18pt; margin: 0; text-align: center;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: rgba(255,255,255,0.6); font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="chapter-num"><p>1</p></div>
<h1>基本用法</h1>
<p class="subtitle">概念理解与日常操作</p>
<div class="pagenum"><p>3 / 15</p></div>
</body>
</html>
