<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 20pt 40pt; flex: 1; display: flex; gap: 25pt;
}
.left {
  flex: 1;
}
.left h2 {
  color: #1A202C; font-size: 18pt; margin: 0 0 15pt 0;
}
.flow {
  display: flex; flex-direction: column; gap: 10pt;
}
.step {
  display: flex; align-items: center; gap: 12pt;
}
.step-num {
  width: 28pt; height: 28pt; background: #8C061C;
  border-radius: 50%; display: flex; justify-content: center; align-items: center;
  flex-shrink: 0;
}
.step-num p {
  color: #ffffff; font-size: 14pt; font-weight: bold; margin: 0;
}
.step-content h3 {
  color: #1A202C; font-size: 13pt; margin: 0;
}
.step-content p {
  color: #718096; font-size: 11pt; margin: 0;
}
.tip {
  background: #FED7D7; padding: 12pt 15pt; border-radius: 6pt;
  border-left: 3pt solid #8C061C; margin-top: 15pt;
}
.tip p {
  color: #8C061C; font-size: 12pt; margin: 0;
}
.right {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.right img {
  max-width: 100%; max-height: 260pt; border-radius: 8pt;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Git 工作流程</h1>
</div>
<div class="content">
  <div class="left">
    <h2>典型工作流程</h2>
    <div class="flow">
      <div class="step">
        <div class="step-num"><p>1</p></div>
        <div class="step-content">
          <h3>修改代码</h3>
          <p>在工作区编辑文件</p>
        </div>
      </div>
      <div class="step">
        <div class="step-num"><p>2</p></div>
        <div class="step-content">
          <h3>暂存更改</h3>
          <p>git add 添加到暂存区</p>
        </div>
      </div>
      <div class="step">
        <div class="step-num"><p>3</p></div>
        <div class="step-content">
          <h3>提交更改</h3>
          <p>git commit 保存版本</p>
        </div>
      </div>
      <div class="step">
        <div class="step-num"><p>4</p></div>
        <div class="step-content">
          <h3>推送远程</h3>
          <p>git push 同步到服务器</p>
        </div>
      </div>
    </div>
    <div class="tip">
      <p>提示：频繁提交，原子性更改</p>
    </div>
  </div>
  <div class="right">
    <img src="../images/git_workflow.png">
  </div>
</div>
<div class="pagenum"><p>8 / 15</p></div>
</body>
</html>
