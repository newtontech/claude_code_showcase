<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 20pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 28pt; margin: 0;
}
.content {
  padding: 20pt 40pt; flex: 1; display: flex; gap: 25pt;
}
.left {
  flex: 1;
}
.left h2 {
  color: #1A202C; font-size: 18pt; margin: 0 0 12pt 0;
}
.left p {
  color: #4A5568; font-size: 12pt; margin: 0 0 12pt 0; line-height: 1.5;
}
.commands {
  display: flex; flex-direction: column; gap: 8pt;
}
.cmd-row {
  display: flex; align-items: center; gap: 12pt;
}
.cmd {
  background: #2D3748; color: #F56565; padding: 5pt 10pt;
  border-radius: 5pt; font-family: Courier New, monospace;
  font-size: 11pt; min-width: 200pt;
}
.cmd p { margin: 0; }
.desc {
  color: #4A5568; font-size: 11pt;
}
.desc p { margin: 0; }
.right {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.right img {
  max-width: 100%; max-height: 240pt; border-radius: 8pt;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Git Rebase</h1>
</div>
<div class="content">
  <div class="left">
    <h2>变基操作</h2>
    <p>Rebase 可以将分支移动到新的基准点，使提交历史更加线性整洁</p>
    <div class="commands">
      <div class="cmd-row">
        <div class="cmd"><p>git rebase [分支]</p></div>
        <div class="desc"><p>将当前分支变基到目标分支</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git rebase -i HEAD~3</p></div>
        <div class="desc"><p>交互式变基最近3个提交</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git rebase --continue</p></div>
        <div class="desc"><p>解决冲突后继续变基</p></div>
      </div>
      <div class="cmd-row">
        <div class="cmd"><p>git rebase --abort</p></div>
        <div class="desc"><p>放弃当前变基操作</p></div>
      </div>
    </div>
  </div>
  <div class="right">
    <img src="../images/git_rebase.png">
  </div>
</div>
<div class="pagenum"><p>13 / 15</p></div>
</body>
</html>
