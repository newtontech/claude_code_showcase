<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.header {
  background: #8C061C; padding: 15pt 40pt;
}
.header h1 {
  color: #ffffff; font-size: 24pt; margin: 0;
}
.content {
  padding: 25pt 40pt; flex: 1; display: flex; gap: 40pt;
}
.chapter {
  flex: 1;
}
.chapter-header {
  display: flex; align-items: center; gap: 10pt; margin-bottom: 15pt;
}
.chapter-num {
  width: 30pt; height: 30pt; background: #8C061C;
  border-radius: 50%; display: flex; justify-content: center; align-items: center;
}
.chapter-num p {
  color: #ffffff; font-size: 16pt; font-weight: bold; margin: 0;
}
.chapter h2 {
  color: #1A202C; font-size: 18pt; margin: 0;
}
.topics {
  padding-left: 40pt;
}
.topics p {
  color: #4A5568; font-size: 13pt; margin: 0 0 8pt 0;
}
.pagenum {
  position: absolute; bottom: 15pt; right: 25pt;
}
.pagenum p {
  color: #8C061C; font-size: 11pt; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>目录</h1>
</div>
<div class="content">
  <div class="chapter">
    <div class="chapter-header">
      <div class="chapter-num"><p>1</p></div>
      <h2>基本用法</h2>
    </div>
    <div class="topics">
      <p>1.1 什么是 Git</p>
      <p>1.2 Git 基本概念</p>
      <p>1.3 初始化与配置</p>
      <p>1.4 日常操作命令</p>
      <p>1.5 工作流程</p>
    </div>
  </div>
  <div class="chapter">
    <div class="chapter-header">
      <div class="chapter-num"><p>2</p></div>
      <h2>高阶用法</h2>
    </div>
    <div class="topics">
      <p>2.1 分支管理</p>
      <p>2.2 远程仓库操作</p>
      <p>2.3 Git Rebase</p>
      <p>2.4 Git Stash</p>
      <p>2.5 冲突解决</p>
    </div>
  </div>
</div>
<div class="pagenum"><p>2 / 15</p></div>
</body>
</html>
